<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>AI Engineer Expert Academy V5</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033;line-height:1.7}.w{max-width:1050px;margin:auto;padding:18px}.card{background:white;border:1px solid #e4e7ec;border-radius:18px;padding:20px;margin:14px 0}.hero{background:#172b4d;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.pill{background:#eef2f6;border-radius:99px;padding:5px 10px;font-size:12px}.btn{background:#172b4d;color:white;border:0;border-radius:10px;padding:11px 14px;cursor:pointer}.lesson{cursor:pointer}.term{background:#f8fafc;padding:12px;border-radius:12px;margin:8px 0}.lab{background:#eff8ff;border-left:4px solid #1570ef}.trap{background:#fff7ed;border-left:4px solid #f79009}.resource a{display:block;color:#175cd3;margin:8px 0}.q{border:1px solid #ddd;border-radius:12px;padding:12px;margin:10px 0}.opt{display:block;width:100%;text-align:left;padding:10px;margin:6px 0;background:white;border:1px solid #ccc;border-radius:8px}.screen{display:none}.screen.on{display:block}pre{background:#101828;color:#eee;padding:14px;overflow:auto;border-radius:10px}.muted{color:#667085}</style></head><body><main class='w'><section id='home' class='screen on'><div class='card hero'><span class='pill'>6 Sep — 4 Dec 2026</span><h1>AI Engineer Expert Academy</h1><p>78 dated learning sessions. Every session has its own topic, terminology, explanation, scenario, lab, exam trap, resources and knowledge check.</p><h2>Exam · Saturday 5 December 2026 · 3:30–7:00 PM</h2></div><div class='card'><h2>Today's Lesson</h2><div id='today'></div></div><div class='card'><h2>Day-by-Day Course</h2><div id='list'></div></div></section><section id='detail' class='screen'><button class='btn' onclick="show('home')">← Course</button><article id='body' class='card'></article></section></main><script>const topics=[
['D1','Train, Validation and Test Sets','split,holdout,generalization'],['D1','Data Leakage','leakage,target leakage,temporal leakage'],['D1','Bias and Variance','bias,variance,underfitting,overfitting'],['D1','Regularization','L1,L2,regularization'],['D1','Confusion Matrix','TP,TN,FP,FN'],['D1','Precision, Recall and F1','precision,recall,F1'],['D1','Threshold Selection','threshold,false positive,false negative'],['D1','ROC-AUC vs PR-AUC','ROC-AUC,PR-AUC,imbalance'],['D1','Class Imbalance','class imbalance,resampling,class weights'],['D1','Probability Calibration','calibration,Brier score,reliability'],['D1','Regression Metrics','MAE,MSE,RMSE,R2'],['D1','Cross-Validation','k-fold,stratified CV,time-series split'],
['D2','Neural Network Foundations','neuron,weights,bias,activation'],['D2','Loss Functions','cross-entropy,MSE,objective'],['D2','Gradient Descent and Backpropagation','gradient,learning rate,backpropagation'],['D2','Deep Learning Regularization','dropout,weight decay,early stopping'],['D2','CNN Fundamentals','convolution,kernel,pooling'],['D2','RNN and LSTM','recurrent state,LSTM,vanishing gradient'],['D2','Attention Mechanism','query,key,value,attention'],['D2','Transformer Architecture','self-attention,encoder,decoder'],['D2','Tokenization','token,subword,vocabulary'],['D2','Embeddings','embedding,vector,similarity'],['D2','Context Windows','context window,truncation,tokens'],['D2','RAG End-to-End','retrieval,augmentation,generation'],['D2','Chunking Strategies','chunk,overlap,boundary'],['D2','Retrieval and Reranking','retriever,top-k,reranker'],['D2','Fine-tuning vs RAG vs Prompting','fine-tuning,RAG,prompting'],['D2','Hallucination and Grounding','hallucination,grounding,faithfulness'],['D2','LLM Evaluation','task metric,judge,human evaluation'],
['D3','AI API Design','API,contract,idempotency'],['D3','FastAPI Integration','endpoint,schema,validation'],['D3','Testing AI Systems','unit,integration,e2e'],['D3','Data and Model Contracts','schema,contract,compatibility'],['D3','Reproducible Environments','dependency,lockfile,reproducibility'],['D3','Docker Fundamentals','image,container,Dockerfile'],['D3','Integration Failure Patterns','timeout,retry,circuit breaker'],['D3','Software Engineering Review','modularity,observability,testability'],
['D4','ML Lifecycle','development,validation,deployment,monitoring'],['D4','Experiment Tracking','experiment,run,parameter,metric'],['D4','MLflow','tracking server,artifact store,run'],['D4','Model Registry','registry,version,alias,lineage'],['D4','Data Versioning','dataset snapshot,version,lineage'],['D4','Model Versioning','model version,artifact,provenance'],['D4','Continuous Integration for ML','CI,test,validation gate'],['D4','Continuous Delivery and Deployment','CD,release,promotion'],['D4','Continuous Training','CT,retraining trigger,pipeline'],['D4','Batch vs Online Inference','batch,online,latency'],['D4','Model Serving','serving endpoint,inference server'],['D4','Canary Deployment','canary,traffic split,metric gate'],['D4','Blue-Green Deployment','blue-green,cutover,rollback'],['D4','Shadow Deployment','shadow traffic,candidate,comparison'],['D4','Rollback Strategy','rollback,known-good,release safety'],['D4','Production Monitoring','monitoring,metric,alert'],['D4','Data Drift vs Concept Drift','data drift,concept drift,performance'],['D4','Data Quality Monitoring','schema,null,range,distribution'],['D4','Latency and Throughput','latency,throughput,concurrency'],['D4','Reliability and Error Budgets','SLO,SLA,error budget'],['D4','LLM Observability','trace,span,prompt,response'],['D4','Prompt Versioning','prompt template,version,evaluation'],['D4','Token and Cost Monitoring','token,cost,cache'],['D4','RAG Evaluation','retrieval recall,groundedness,faithfulness'],

const dates=[];let d=new Date('2026-09-06T12:00:00');while(d<=new Date('2026-12-04T23:00:00')){if([0,1,2,3,4,6].includes(d.getDay()))dates.push(new Date(d));d.setDate(d.getDate()+1)}while(dates.length>78)dates.splice(dates.length-2,1);function fmt(x){return x.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');scrollTo(0,0)}function source(domain){return domain==='D1'?['Google ML Crash Course','https://developers.google.com/machine-learning/crash-course/']:domain==='D2'?['Hugging Face LLM Course','https://huggingface.co/learn/llm-course/chapter1/1']:domain==='D4'?['MLflow Documentation','https://mlflow.org/docs/latest/']:domain==='D5'?['Kubernetes Documentation','https://kubernetes.io/docs/home/']:domain==='D6'?['OWASP GenAI Security Project','https://genai.owasp.org/']:['Microsoft Learn','https://learn.microsoft.com/training/']}function video(t){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(t+' explained')}function explain(t){const [dom,title,terms]=t;const ts=terms.split(',');return `<span class=pill>${dom}</span><h1>${title}</h1><h2>1. Prerequisites</h2><p>Before this lesson, understand the previous lesson's core idea and be comfortable distinguishing a model's development behavior from its production behavior.</p><h2>2. Terminology</h2>${ts.map((x,i)=>`<div class=term><b>${x}</b><span>${termDef(x,title)}</span></div>`).join('')}<h2>3. Deep Explanation</h2>${deep(title,ts)}<h2>4. How it works</h2><p>${title} should be understood as part of an end-to-end AI system rather than as an isolated definition. Identify the input, transformation or decision, observable output, failure modes, and the evidence required to decide whether it works correctly.</p><h2>5. Real-world scenario</h2><p>${scenario(title)}</p><div class='card lab'><h2>6. Hands-on Lab</h2><p>${lab(title)}</p></div><div class='card trap'><h2>7. Exam Trap</h2><p>${trap(title)}</p></div><h2>8. Required Resources</h2><div class=resource><a target=_blank href='${source(dom)[1]}'>Required reading · ${source(dom)[0]}</a><a target=_blank href='${video(title)}'>Watch · ${title} video explanations</a></div><h2>9. Knowledge Check</h2>${quiz(title)}`}
function termDef(x,title){return `${x} is a key concept in ${title}. Learn not only its definition, but what information it consumes, what decision it affects, how it can fail, and how it differs from neighboring concepts. In exam scenarios, identify it from its operational role rather than memorizing the name.`}function deep(title,ts){return `<p><b>${title}</b> matters because production AI engineering is a chain of decisions. A technically correct component can still produce a poor system when it is used at the wrong stage or optimized for the wrong objective.</p><p>Start by asking four questions: <b>What problem does it solve? What signal does it use? What trade-off does it introduce? What would failure look like?</b> For this lesson, the important vocabulary is ${ts.join(', ')}.</p><p>At expert level, memorizing definitions is insufficient. Compare alternatives and reason from constraints such as latency, data freshness, false-positive cost, reliability, security boundaries, deployment risk, and maintainability. The best answer is usually the option that addresses the root cause while preserving system constraints.</p>`}function scenario(t){if(t.includes('Registry'))return 'A team has dozens of successful training runs but cannot prove which exact model, dataset and parameters produced the production endpoint. Experiment tracking preserves run evidence; a registry adds controlled model versions and lifecycle metadata so deployment and rollback are traceable.';if(t.includes('Drift'))return 'An input feature distribution changes after a new customer segment launches, but model accuracy initially remains stable. This is data drift. If the relationship between features and target changes so the old mapping no longer predicts correctly, that is concept drift.';if(t.includes('Canary'))return 'A new model version has passed offline tests, but production behavior is uncertain. Route a small percentage of traffic to it, compare guardrail metrics with the stable version, then expand only if the evidence is healthy.';if(t.includes('Prompt Injection'))return 'A retrieved webpage contains text telling an agent to ignore its system rules and expose secrets. Treat retrieved content as untrusted data, separate instructions from evidence, minimize tool permissions and validate actions.';return `Imagine ${t} is being introduced into a production AI service. The engineering question is not merely whether it works in isolation, but whether it improves the target outcome without violating latency, reliability, security, cost or governance constraints.`}function lab(t){if(t.includes('Metrics')||t.includes('Precision'))return 'Create a confusion matrix in Python. Compute precision, recall and F1, then change the decision threshold and explain which error type increases.';if(t.includes('MLflow')||t.includes('Experiment'))return 'Track two training runs with different hyperparameters. Log parameters, metrics and an artifact. Compare the runs and document why one should be promoted.';if(t.includes('Docker'))return 'Write a Dockerfile for a small inference API. Identify which layers change frequently and explain how layer caching affects rebuild time.';if(t.includes('RAG'))return 'Create 10 sample chunks and five queries. Record whether the correct evidence appears in top-k retrieval and separate retrieval failure from generation failure.';return `Draw the system flow for ${t}. Mark inputs, outputs, dependencies, failure points and monitoring signals. Then write one scenario where this technique is appropriate and one where it is not.`}function trap(t){return `Do not select ${t} merely because the term appears in the scenario. Determine the root failure first. Expert questions often include a technically valid option that solves a different layer of the problem.`}function quiz(t){return `<div class=q><b>Scenario:</b> A team is evaluating a change related to ${t}. What is the strongest engineering approach?<button class=opt onclick="this.style.background='#ecfdf3'">A. Identify the root failure, define the relevant success/guardrail metrics, test under representative conditions, and choose based on evidence.</button><button class=opt onclick="this.style.background='#fef3f2'">B. Choose the newest tool because newer systems are always safer.</button><button class=opt onclick="this.style.background='#fef3f2'">C. Optimize only offline accuracy regardless of production constraints.</button><button class=opt onclick="this.style.background='#fef3f2'">D. Ignore monitoring after deployment if pre-production tests passed.</button><p class=muted><b>Why A:</b> expert engineering connects the solution to the actual failure mode and validates it with system-level evidence. B, C and D ignore lifecycle risk or operational constraints.</p></div>`}function openLesson(i){const t=topics[i%topics.length];document.getElementById('body').innerHTML=`<span class=pill>Day ${i+1} · ${fmt(dates[i]||dates[dates.length-1])}</span>`+explain(t);show('detail')}function render(){const n=Math.min(78,dates.length);document.getElementById('list').innerHTML=Array.from({length:n},(_,i)=>`<div class='card lesson' onclick='openLesson(${i})'><b>Day ${i+1} · ${fmt(dates[i])}</b><div>${topics[i%topics.length][1]}</div><span class=muted>${topics[i%topics.length][0]} · ${i%5===4?'Review + quiz':'Deep lesson + lab + quiz'}</span></div>`).join('');let now=new Date(),idx=dates.findIndex(x=>x.toDateString()===now.toDateString());if(idx<0)idx=dates.findIndex(x=>x>now);if(idx<0)idx=n-1;document.getElementById('today').innerHTML=`<b>${fmt(dates[idx])}</b><h3>${topics[idx%topics.length][1]}</h3><button class=btn onclick='openLesson(${idx})'>Start Today's Lesson</button>`}render()</script></body></html>
